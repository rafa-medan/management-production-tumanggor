<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Production Tumanggor - Admin Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0b;
      --bg-card: #141416;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #d1d5db;
      --border-gold: rgba(212, 175, 55, 0.4);
    }

    body {
      background: linear-gradient(rgba(10, 10, 11, 0.78), rgba(10, 10, 11, 0.86)), url('background-mpt-resized.png') center / cover fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .navbar-admin {
      background: rgba(10, 10, 11, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-gold);
      padding: 15px 0;
    }

    .navbar-brand-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-primary) 0%, #e5c158 100%);
      border: none;
      color: var(--bg-dark);
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .btn-gold:hover {
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
      color: var(--bg-dark);
    }

    .container-admin {
      padding: 40px 20px;
    }

    .card-product {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .card-product:hover {
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
    }

    .form-label {
      color: var(--gold-primary);
      font-weight: 600;
      margin-top: 15px;
    }

    .form-control {
      background: rgba(17, 20, 27, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--text-main);
      border-radius: 8px;
    }

    .form-control:focus {
      background: rgba(17, 20, 27, 0.96);
      border-color: var(--gold-primary);
      color: var(--text-main);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    .btn-sm {
      font-weight: 600;
    }

    .badge-trending {
      background: linear-gradient(135deg, #ff6b6b, #ffa500);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
    }

    .text-gold { color: var(--gold-primary); }
    .text-muted-clear { color: var(--text-muted); }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar-admin">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <div class="navbar-brand-text d-flex align-items-center gap-2">
          <img src="logo-mpt-resized.png" alt="Management Production Tumanggor" style="height: 38px; width: auto;"> Management Production Tumanggor - Admin Produk
        </div>
        <div>
          <a href="dashboard.html" class="btn btn-sm btn-outline-light me-2">← Kembali ke Dashboard</a>
          <button onclick="logout()" class="btn btn-sm btn-outline-danger">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container-admin">
    <div class="container">
      <!-- Header -->
      <div class="row mb-5">
        <div class="col-12">
          <h1 class="text-gold mb-2"><span id="divisiName"></span> - Kelola Produk</h1>
          <p class="text-muted-clear">Edit produk trending dan informasi kontak divisi Anda</p>
        </div>
      </div>

      <!-- Tab Produk -->
      <div class="row">
        <div class="col-12">
          <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item">
              <button class="nav-link active text-gold" id="produk-tab" data-bs-toggle="tab" data-bs-target="#produk-content">
                <i class="fas fa-list"></i> Daftar Produk
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link text-gold" id="kontak-tab" data-bs-toggle="tab" data-bs-target="#kontak-content">
                <i class="fas fa-phone"></i> Informasi Kontak
              </button>
            </li>
          </ul>

          <!-- Tab Produk -->
          <div class="tab-content">
            <div class="tab-pane fade show active" id="produk-content">
              <div id="produkList"></div>
            </div>

            <!-- Tab Kontak -->
            <div class="tab-pane fade" id="kontak-content">
              <div class="card-product">
                <h5 class="text-gold mb-4">Informasi Kontak Divisi</h5>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label">Nama Divisi</label>
                      <input type="text" class="form-control" id="kontakNama" readonly>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Contact Person</label>
                      <input type="text" class="form-control" id="kontakPerson">
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Email</label>
                      <input type="email" class="form-control" id="kontakEmail">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label class="form-label">Nomor Telepon</label>
                      <input type="text" class="form-control" id="kontakPhone">
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Deskripsi Divisi</label>
                      <textarea class="form-control" id="kontakDesc" rows="3"></textarea>
                    </div>
                  </div>
                </div>
                <button onclick="saveKontak()" class="btn btn-gold mt-3">
                  <i class="fas fa-save"></i> Simpan Kontak
                </button>
                <div id="kontakStatus" class="mt-2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT PRODUK -->
  <div class="modal fade" id="editProdukModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content" style="background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: 12px;">
        <div class="modal-header" style="border-bottom: 1px solid var(--border-gold);">
          <h5 class="modal-title text-gold"><i class="fas fa-edit"></i> Edit Produk</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nama Produk</label>
            <input type="text" class="form-control" id="editNama">
          </div>
          <div class="mb-3">
            <label class="form-label">Deskripsi</label>
            <textarea class="form-control" id="editDeskripsi" rows="3"></textarea>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Harga</label>
                <input type="text" class="form-control" id="editHarga" placeholder="Rp ...">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Durasi</label>
                <input type="text" class="form-control" id="editDurasi">
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Rating</label>
            <input type="number" class="form-control" id="editRating" min="0" max="5" step="0.1">
          </div>
          <div class="mb-3">
            <label class="form-label">Jumlah Review</label>
            <input type="number" class="form-control" id="editReviews" min="0">
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="editTrending">
            <label class="form-check-label" for="editTrending">Produk Trending</label>
          </div>
        </div>
        <div class="modal-footer" style="border-top: 1px solid var(--border-gold);">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-gold" onclick="saveProduk()">Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentDivisi = null;
    let currentEditId = null;
    let productsData = {};
    const LOCAL_DATA_API = '/api/data/products';

    async function saveProductsData() {
      const response = await fetch(LOCAL_DATA_API, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(productsData)
      });
      if (!response.ok) throw new Error('Data produk gagal disimpan ke folder local-data.');
    }

    async function loadData() {
      try {
        const response = await fetch(LOCAL_DATA_API, { cache: 'no-store' });
        if (!response.ok) throw new Error('Local data API unavailable');
        productsData = await response.json();
        if (!Object.keys(productsData).length) {
          const seedResponse = await fetch('products-data.json', { cache: 'no-store' });
          productsData = await seedResponse.json();
          await saveProductsData();
        }
      } catch (e) {
        const fallback = JSON.parse(localStorage.getItem('products_data') || '{}');
        productsData = Object.keys(fallback).length ? fallback : JSON.parse('{}');
      }

      let user = {};
      try {
        user = JSON.parse(sessionStorage.getItem('multicorp_session') || '{}');
      } catch (error) {
        sessionStorage.removeItem('multicorp_session');
        user = {};
      }

      const sessionIsCurrent = user.timestamp && Date.now() - Number(user.timestamp) < 8 * 60 * 60 * 1000;
      const isAuthorized = !!user.username && (user.role === 'ADMIN_DIVISI' || user.role === 'SUPER_ADMIN') && user.enabled !== false && sessionIsCurrent;

      if (!isAuthorized) {
        sessionStorage.removeItem('multicorp_session');
        window.location.replace('login.html');
        return;
      }

      const divisiMap = {
        'IT Program': 'it_program',
        'Network': 'network',
        'Nusantara Food': 'nusantara_food'
      };

      if (user.role === 'SUPER_ADMIN') {
        currentDivisi = currentDivisi || 'it_program';
      } else {
        currentDivisi = divisiMap[user.divisi];
      }

      if (!currentDivisi || !productsData[currentDivisi]) {
        document.body.innerHTML = `
          <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: #0a0a0b; color: #fff;">
            <div class="text-center p-4" style="background: #141416; border: 1px solid rgba(212,175,55,0.4); border-radius: 12px; max-width: 420px;">
              <i class="fas fa-lock text-warning mb-3" style="font-size: 2.5rem;"></i>
              <h4 class="text-gold mb-2">Akses Terbatas</h4>
              <p class="text-muted small mb-4">Halaman ini hanya dapat diakses oleh Admin Divisi atau Super Admin yang telah terautentikasi.</p>
              <a href="login.html" class="btn btn-gold btn-sm px-4">Masuk ke Akun</a>
            </div>
          </div>
        `;
        return;
      }

      document.getElementById('divisiName').textContent = user.divisi;
      loadProduk();
      loadKontak();
    }

    function loadProduk() {
      const divisiData = productsData[currentDivisi];
      const html = divisiData.products.map(prod => `
        <div class="card-product">
          <div class="row">
            <div class="col-md-8">
              <div class="d-flex align-items-start gap-3">
                <div style="font-size: 2rem; color: var(--gold-primary);">
                  <i class="fas fa-box"></i>
                </div>
                <div>
                  <div class="d-flex align-items-center gap-2">
                    <h5 class="text-gold mb-1">${prod.name}</h5>
                    ${prod.trending ? '<span class="badge-trending">TRENDING</span>' : ''}
                  </div>
                  <p class="text-muted-clear small mb-2">${prod.description}</p>
                  <div class="small text-muted-clear">
                    <i class="fas fa-tag"></i> <strong>${prod.price}</strong> | 
                    <i class="fas fa-clock"></i> ${prod.duration}
                  </div>
                  <div class="small text-muted-clear mt-2">
                    ⭐ ${prod.rating} (${prod.reviews} reviews)
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4 text-end">
              <button onclick="editProduk('${prod.id}')" class="btn btn-sm btn-outline-gold me-2">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button onclick="deleteProduk('${prod.id}')" class="btn btn-sm btn-outline-danger">
                <i class="fas fa-trash"></i> Hapus
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('produkList').innerHTML = html + `
        <button onclick="addProduk()" class="btn btn-gold w-100 mt-4">
          <i class="fas fa-plus"></i> Tambah Produk Baru
        </button>
      `;
    }

    function editProduk(id) {
      const divisiData = productsData[currentDivisi];
      const prod = divisiData.products.find(p => p.id === id);

      if (prod) {
        currentEditId = id;
        document.getElementById('editNama').value = prod.name;
        document.getElementById('editDeskripsi').value = prod.description;
        document.getElementById('editHarga').value = prod.price;
        document.getElementById('editDurasi').value = prod.duration;
        document.getElementById('editRating').value = prod.rating;
        document.getElementById('editReviews').value = prod.reviews;
        document.getElementById('editTrending').checked = prod.trending;

        new bootstrap.Modal(document.getElementById('editProdukModal')).show();
      }
    }

    async function saveProduk() {
      if (!currentEditId) return;

      const divisiData = productsData[currentDivisi];
      const prodIdx = divisiData.products.findIndex(p => p.id === currentEditId);

      if (prodIdx >= 0) {
        divisiData.products[prodIdx] = {
          ...divisiData.products[prodIdx],
          name: document.getElementById('editNama').value,
          description: document.getElementById('editDeskripsi').value,
          price: document.getElementById('editHarga').value,
          duration: document.getElementById('editDurasi').value,
          rating: parseFloat(document.getElementById('editRating').value),
          reviews: parseInt(document.getElementById('editReviews').value),
          trending: document.getElementById('editTrending').checked
        };

        await saveProductsData();
        localStorage.setItem('products_data', JSON.stringify(productsData));
        bootstrap.Modal.getInstance(document.getElementById('editProdukModal')).hide();
        loadProduk();
        showAlert('Produk berhasil diperbarui!', 'success');
      }
    }

    async function deleteProduk(id) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        const divisiData = productsData[currentDivisi];
        divisiData.products = divisiData.products.filter(p => p.id !== id);
        await saveProductsData();
        localStorage.setItem('products_data', JSON.stringify(productsData));
        loadProduk();
        showAlert('Produk berhasil dihapus!', 'success');
      }
    }

    function addProduk() {
      currentEditId = 'NEW-' + Date.now();
      document.getElementById('editNama').value = '';
      document.getElementById('editDeskripsi').value = '';
      document.getElementById('editHarga').value = '';
      document.getElementById('editDurasi').value = '';
      document.getElementById('editRating').value = '4.5';
      document.getElementById('editReviews').value = '0';
      document.getElementById('editTrending').checked = false;

      new bootstrap.Modal(document.getElementById('editProdukModal')).show();
    }

    function loadKontak() {
      const divisiData = productsData[currentDivisi];
      document.getElementById('kontakNama').value = divisiData.divisi;
      document.getElementById('kontakPerson').value = divisiData.contact_person;
      document.getElementById('kontakEmail').value = divisiData.email;
      document.getElementById('kontakPhone').value = divisiData.phone;
      document.getElementById('kontakDesc').value = divisiData.description;
    }

    async function saveKontak() {
      const divisiData = productsData[currentDivisi];
      divisiData.contact_person = document.getElementById('kontakPerson').value;
      divisiData.email = document.getElementById('kontakEmail').value;
      divisiData.phone = document.getElementById('kontakPhone').value;
      divisiData.description = document.getElementById('kontakDesc').value;

      await saveProductsData();
      localStorage.setItem('products_data', JSON.stringify(productsData));
      showAlert('Informasi kontak berhasil disimpan!', 'success', 'kontakStatus');
    }

    function showAlert(msg, type, elementId = null) {
      const html = `<div class="alert alert-${type === 'success' ? 'success' : 'danger'}" role="alert">${msg}</div>`;
      if (elementId) {
        document.getElementById(elementId).innerHTML = html;
      } else {
        alert(msg);
      }
    }

    function logout() {
      sessionStorage.removeItem('multicorp_session');
      localStorage.removeItem('management_production_user');
      localStorage.removeItem('multicorp_user');
      window.location.href = 'login.html';
    }

    loadData();
  </script>
</body>
</html>
