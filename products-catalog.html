<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Production Tumanggor - Katalog Produk</title>
  <meta name="description" content="Katalog produk dan layanan Management Production Tumanggor: IT Program, Network, dan Nusantara Food.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://management-production-tumanggor.netlify.app/products-catalog.html">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0b;
      --bg-card: #141416;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #ffffff;
      --text-muted: #d1d5db;
      --border-gold: rgba(212, 175, 55, 0.4);
    }

    body {
      background: linear-gradient(rgba(10, 10, 11, 0.78), rgba(10, 10, 11, 0.86)), url('background-mpt-resized.png') center / cover fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    .navbar-catalog {
      background: rgba(10, 10, 11, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-gold);
      padding: 15px 0;
    }

    .navbar-brand-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .container-catalog {
      padding: 40px 20px;
    }

    .divisi-tab-btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 8px;
      margin: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .divisi-tab-btn:hover,
    .divisi-tab-btn.active {
      background: linear-gradient(135deg, var(--gold-primary) 0%, #e5c158 100%);
      color: var(--bg-dark);
      border-color: var(--gold-primary);
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 25px;
      height: 100%;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      box-shadow: 0 12px 40px rgba(212, 175, 55, 0.2);
      transform: translateY(-6px);
      border-color: var(--gold-primary);
    }

    .product-icon {
      font-size: 3rem;
      color: var(--gold-primary);
      margin-bottom: 15px;
    }

    .product-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .product-desc {
      color: var(--text-muted);
      margin-bottom: 15px;
      flex-grow: 1;
      font-size: 0.95rem;
    }

    .product-info {
      background: rgba(212, 175, 55, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .product-price {
      color: var(--gold-primary);
      font-weight: 700;
    }

    .product-duration {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .product-rating {
      color: var(--gold-light);
      font-size: 0.9rem;
      margin: 10px 0;
    }

    .badge-trending {
      background: linear-gradient(135deg, #ff6b6b, #ffa500);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-contact {
      background: linear-gradient(135deg, var(--gold-primary) 0%, #e5c158 100%);
      border: none;
      color: var(--bg-dark);
      font-weight: 700;
      transition: all 0.3s ease;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      margin-top: auto;
    }

    .btn-contact:hover {
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
    }

    .text-gold { color: var(--gold-primary); }
    .text-muted-clear { color: var(--text-muted); }

    .divisi-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(212, 175, 55, 0.08);
      border-radius: 12px;
      border: 1px solid var(--border-gold);
    }

    .divisi-header-icon {
      font-size: 2.5rem;
      color: var(--gold-primary);
    }

    .divisi-header-text h3 {
      color: var(--gold-light);
      margin: 0;
    }

    .divisi-header-text p {
      color: var(--text-muted);
      margin: 5px 0 0 0;
      font-size: 0.95rem;
    }

    .divisi-contact {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .divisi-contact h5 {
      color: var(--gold-primary);
      margin-bottom: 15px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--text-muted);
    }

    .contact-item i {
      color: var(--gold-primary);
      width: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar-catalog">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <div class="navbar-brand-text d-flex align-items-center gap-2">
          <img src="logo-mpt-resized.png" alt="Management Production Tumanggor" style="height: 38px; width: auto;"> Management Production Tumanggor - Katalog Produk
        </div>
        <div>
          <a href="index.html" class="btn btn-sm btn-outline-light">← Kembali</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container-catalog">
    <div class="container">
      <!-- Header -->
      <div class="row mb-5">
        <div class="col-12">
          <h1 class="text-gold mb-2">Katalog Produk Kami</h1>
          <p class="text-muted-clear">Jelajahi semua layanan premium dari tiga divisi kami</p>
        </div>
      </div>

      <!-- Filter Divisi -->
      <div class="row mb-5">
        <div class="col-12 text-center">
          <button class="divisi-tab-btn active" onclick="filterDivisi('all')">
            <i class="fas fa-th-large"></i> Semua Produk
          </button>
          <button class="divisi-tab-btn" onclick="filterDivisi('it_program')">
            <i class="fas fa-laptop"></i> IT Program
          </button>
          <button class="divisi-tab-btn" onclick="filterDivisi('network')">
            <i class="fas fa-wifi"></i> Network
          </button>
          <button class="divisi-tab-btn" onclick="filterDivisi('nusantara_food')">
            <i class="fas fa-utensils"></i> Nusantara Food
          </button>
        </div>
      </div>

      <!-- Divisi Content -->
      <div id="catalogContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let productsData = {};
    let currentFilter = 'all';

    async function loadData() {
      try {
        const response = await fetch('/api/data/products', { cache: 'no-store' });
        if (response.ok) {
          productsData = await response.json();
        }
      } catch (e) {}

      if (!productsData || !Object.keys(productsData).length) {
        try {
          const seedResponse = await fetch('products-data.json', { cache: 'no-store' });
          if (seedResponse.ok) {
            productsData = await seedResponse.json();
          }
        } catch (e) {}
      }

      if (!productsData || !Object.keys(productsData).length) {
        const stored = localStorage.getItem('products_data');
        productsData = stored ? JSON.parse(stored) : {};
      }

      renderCatalog();
    }

    function filterDivisi(divisi) {
      currentFilter = divisi;
      document.querySelectorAll('.divisi-tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      renderCatalog();
    }

    function renderCatalog() {
      const divisiKeys = currentFilter === 'all' ? 
        Object.keys(productsData) : 
        [currentFilter];

      let html = '';

      divisiKeys.forEach(divisiKey => {
        const divisiData = productsData[divisiKey];
        if (!divisiData) return;

        html += `
          <div class="row mb-5">
            <div class="col-12">
              <div class="divisi-header">
                <div class="divisi-header-icon"><i class="fas ${divisiData.icon}"></i></div>
                <div class="divisi-header-text">
                  <h3>${divisiData.divisi}</h3>
                  <p>${divisiData.description}</p>
                </div>
              </div>

              <div class="divisi-contact">
                <h5><i class="fas fa-info-circle"></i> Informasi Kontak</h5>
                <div class="contact-item">
                  <i class="fas fa-user"></i>
                  <span><strong>${divisiData.contact_person}</strong></span>
                </div>
                <div class="contact-item">
                  <i class="fas fa-phone"></i>
                  <a href="tel:${divisiData.phone}" style="color: var(--text-muted); text-decoration: none;">${divisiData.phone}</a>
                </div>
                <div class="contact-item">
                  <i class="fas fa-envelope"></i>
                  <a href="mailto:${divisiData.email}" style="color: var(--text-muted); text-decoration: none;">${divisiData.email}</a>
                </div>
              </div>

              <div class="row g-4">
        `;

        divisiData.products.forEach(product => {
          html += `
            <div class="col-lg-4 col-md-6">
              <div class="product-card">
                <div class="product-icon"><i class="fas fa-box"></i></div>
                <h5 class="product-name">${product.name}</h5>
                <p class="product-desc">${product.description}</p>
                
                <div class="product-info">
                  <div class="product-price"><i class="fas fa-tag"></i> ${product.price}</div>
                  <div class="product-duration"><i class="fas fa-clock"></i> ${product.duration}</div>
                </div>

                <div class="product-rating">
                  <i class="fas fa-star" style="color: #ffd700;"></i> ${product.rating} 
                  <span style="color: #999;">(${product.reviews} reviews)</span>
                </div>

                ${product.trending ? '<span class="badge-trending"><i class="fas fa-fire"></i> TRENDING</span>' : ''}

                <a href="tel:${divisiData.phone}" class="btn btn-contact">
                  <i class="fas fa-phone"></i> Hubungi Divisi
                </a>
              </div>
            </div>
          `;
        });

        html += `
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('catalogContent').innerHTML = html;
      updateFilterButtons();
    }

    function updateFilterButtons() {
      document.querySelectorAll('.divisi-tab-btn').forEach((btn, idx) => {
        btn.classList.remove('active');
        if (idx === 0 && currentFilter === 'all') {
          btn.classList.add('active');
        } else if (idx > 0 && btn.textContent.toLowerCase().includes(currentFilter)) {
          btn.classList.add('active');
        }
      });
    }

    loadData();
  </script>
</body>
</html>
