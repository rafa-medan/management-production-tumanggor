<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Production Tumanggor - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0b;
      --bg-card: #141416;
      --bg-card-hover: #1c1c20;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-accent: #e5c158;
      --text-main: #ffffff;
      --text-muted: #dfe7f5;
      --text-soft: #eef3ff;
      --border-gold: rgba(212, 175, 55, 0.45);
      --panel-soft: rgba(20, 20, 22, 0.9);
    }

    body {
      background: linear-gradient(rgba(10, 10, 11, 0.68), rgba(10, 10, 11, 0.78)), url('background-mpt-resized.png') center / cover fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ===== BACKGROUND ANIMATION ===== */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 20s infinite ease-in-out;
      top: -100px;
      right: -100px;
    }

    .bg-animation::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 25s infinite ease-in-out reverse;
      bottom: -150px;
      left: -150px;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    /* ===== LOGIN CONTAINER ===== */
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      z-index: 1;
    }

    .login-card {
      background: var(--panel-soft);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .login-card:hover {
      border-color: var(--gold-primary);
      box-shadow: 0 20px 80px rgba(212, 175, 55, 0.2);
    }

    /* ===== HEADER ===== */
    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-icon {
      font-size: 3.5rem;
      color: var(--gold-primary);
      margin-bottom: 15px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #fff9d8 0%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.15);
    }

    .login-subtitle {
      font-size: 0.95rem;
      color: var(--text-soft);
    }

    /* ===== FORM STYLES ===== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      font-weight: 600;
      color: var(--gold-primary);
      font-size: 0.9rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      background: rgba(17, 20, 27, 0.9);
      border: 2px solid rgba(212, 175, 55, 0.3);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .form-control:focus {
      background: rgba(17, 20, 27, 0.96);
      border-color: var(--gold-primary);
      color: var(--text-main);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    .form-control::placeholder {
      color: rgba(223, 231, 245, 0.72);
    }

    /* ===== CHECKBOX ===== */
    .form-check {
      margin-bottom: 20px;
    }

    .form-check-input {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(212, 175, 55, 0.4);
      cursor: pointer;
      background: transparent;
    }

    .form-check-input:checked {
      background-color: var(--gold-primary);
      border-color: var(--gold-primary);
    }

    .form-check-label {
      color: var(--text-soft);
      font-size: 0.9rem;
      margin-left: 8px;
      cursor: pointer;
    }

    /* ===== BUTTON ===== */
    .btn-login {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-accent) 100%);
      border: none;
      color: var(--bg-dark);
      font-weight: 700;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: left 0.3s ease;
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, var(--gold-accent) 0%, var(--gold-primary) 100%);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== LOADING STATE ===== */
    .loading-spinner {
      display: none;
      margin-right: 10px;
    }

    .btn-login.loading {
      pointer-events: none;
    }

    .btn-login.loading .loading-spinner {
      display: inline-block;
    }

    /* ===== DIVIDER ===== */
    .divider {
      display: flex;
      align-items: center;
      margin: 30px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(212, 175, 55, 0.2);
    }

    .divider-text {
      padding: 0 15px;
    }

    /* ===== DEMO ACCOUNTS ===== */
    .demo-accounts {
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin: 30px 0 0;
    }

    .demo-accounts h6 {
      color: var(--gold-primary);
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .demo-account {
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .demo-account strong {
      color: var(--gold-primary);
      font-weight: 700;
      display: block;
    }

    .demo-account:hover {
      background: rgba(212, 175, 55, 0.1);
      transform: translateX(5px);
    }

    .demo-account:last-child {
      margin-bottom: 0;
    }

    .demo-account-label {
      color: var(--gold-primary);
      font-weight: 600;
      display: block;
    }

    .demo-account-cred {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* ===== ALERT ===== */
    .alert-custom {
      border: none;
      border-radius: 8px;
      border-left: 4px solid;
      margin-bottom: 20px;
      display: none;
    }

    .alert-custom.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-error {
      background: rgba(220, 53, 69, 0.1);
      border-color: #dc3545;
      color: #ff6b6b;
    }

    .alert-success {
      background: rgba(40, 167, 69, 0.1);
      border-color: #28a745;
      color: #51cf66;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .login-wrapper {
        max-width: 100%;
      }

      .login-card {
        padding: 30px 20px;
      }

      .login-title {
        font-size: 1.5rem;
      }

      .login-icon {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

<!-- BACKGROUND ANIMATION -->
<div class="bg-animation"></div>

<!-- LOGIN CONTAINER -->
<div class="login-wrapper">
  <div class="login-card">
    <!-- HEADER -->
    <div class="login-header">
      <img src="logo-mpt-resized.png" alt="Management Production Tumanggor" style="width: min(100%, 360px); height: auto; margin-bottom: 18px;">
      <div class="login-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="login-title">Management Production Tumanggor</h1>
      <p class="login-subtitle">Enterprise Portal Login</p>
    </div>

    <!-- ALERT MESSAGES -->
    <div class="alert alert-custom alert-error" id="alertError">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorMessage"></span>
    </div>
    <div class="alert alert-custom alert-success" id="alertSuccess">
      <i class="fas fa-check-circle"></i>
      <span id="successMessage"></span>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Username Input -->
      <div class="form-group">
        <label for="username" class="form-label">
          <i class="fas fa-user"></i> Username
        </label>
        <input
          type="text"
          class="form-control"
          id="username"
          placeholder="Masukkan username"
          required
          autocomplete="username"
        >
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fas fa-key"></i> Password
        </label>
        <input
          type="password"
          class="form-control"
          id="password"
          placeholder="Masukkan password"
          required
          autocomplete="current-password"
        >
      </div>

      <div class="text-end mb-3">
        <button type="button" class="btn btn-link text-gold p-0" id="forgotPasswordButton" style="display: none;" onclick="requestForgotPassword()">
          Lupa Password?
        </button>
      </div>

      <!-- Remember Me -->
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          id="rememberMe"
          value=""
        >
        <label class="form-check-label" for="rememberMe">
          Ingat saya di perangkat ini
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-login" id="btnLogin">
        <span class="loading-spinner">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        </span>
        <span class="btn-text">Masuk</span>
      </button>
    </form>

    <div class="text-center text-muted small mt-4">
      Gunakan akun resmi yang diberikan administrator.
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ===== CONFIG =====
  // Ganti dengan URL deployment Google Apps Script Anda
  const API_URL = 'https://script.google.com/macros/s/AKfycbwgUeXbvQLpaJ78NW_cnUEi06aCEV3Q0vkcmC-80ROIU3l0m9jQc--186th3OTFzxhmWQ/exec';

  // ===== ALERT FUNCTIONS =====
  function showAlert(type, message) {
    const errorAlert = document.getElementById('alertError');
    const successAlert = document.getElementById('alertSuccess');
    
    if (type === 'error') {
      document.getElementById('errorMessage').textContent = message;
      errorAlert.classList.add('show');
      successAlert.classList.remove('show');
    } else if (type === 'success') {
      document.getElementById('successMessage').textContent = message;
      successAlert.classList.add('show');
      errorAlert.classList.remove('show');
    }
  }

  function hideAlerts() {
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('alertSuccess').classList.remove('show');
  }

  // ===== DEMO ACCOUNT FILLER =====
  function fillDemoAccount(username, password) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
    document.getElementById('username').focus();
  }

  // ===== LOGIN HANDLER =====
  async function handleLogin(event) {
    event.preventDefault();
    hideAlerts();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const rememberMe = document.getElementById('rememberMe').checked;
    const btnLogin = document.getElementById('btnLogin');

    if (!username || !password) {
      showAlert('error', 'Username dan password tidak boleh kosong');
      return;
    }

    btnLogin.classList.add('loading');
    btnLogin.disabled = true;

    try {
      const user = await simulateLogin(username, password);
      if (!user || !user.role) {
        throw new Error('Respon login tidak valid. Hubungi administrator.');
      }

      showAlert('success', 'Login berhasil! Redirect ke portal...');

      const session = {
        username: username,
        role: user.role,
        name: user.name || username,
        divisi: user.divisi || 'ALL',
        jabatan: user.jabatan || '',
        email: user.email || `${username}@multicorp.com`,
        phone: user.phone || '',
        permissions: Array.isArray(user.permissions) ? user.permissions : [],
        token: user.token || `${Date.now()}`,
        timestamp: Date.now()
      };

      localStorage.removeItem('management_production_user');
      localStorage.removeItem('multicorp_user');
      if (rememberMe) localStorage.setItem('multicorp_last_username', username);

      sessionStorage.setItem('multicorp_session', JSON.stringify(session));

      setTimeout(() => {
        if (user.role === 'PARTNER' || user.role === 'CUSTOMER') {
          window.location.href = 'index.html';
        } else {
          window.location.href = 'dashboard.html?user=' + encodeURIComponent(username);
        }
      }, 1500);

    } catch (error) {
      const warning = error && error.warning ? ` ${error.warning}` : '';
      const forgotButton = document.getElementById('forgotPasswordButton');
      const failedAttempts = Number(error && error.failedAttempts ? error.failedAttempts : 0);
      if (forgotButton) {
        forgotButton.style.display = failedAttempts >= 3 && failedAttempts < 5 ? 'inline-block' : 'none';
      }
      showAlert('error', (error && error.message ? error.message : 'Login gagal. Coba lagi!') + warning);
    } finally {
      btnLogin.classList.remove('loading');
      btnLogin.disabled = false;
    }
  }

  async function requestForgotPassword() {
    const username = document.getElementById('username').value.trim();
    if (!username) {
      showAlert('error', 'Masukkan username terlebih dahulu.');
      return;
    }

    const button = document.getElementById('forgotPasswordButton');
    button.disabled = true;
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'REQUEST_PASSWORD_RESET', usernameOrEmail: username })
      });
      const result = await response.json();
      showAlert(result.success ? 'success' : 'error', result.message || 'Permintaan reset password gagal.');
    } catch (error) {
      showAlert('error', 'Layanan konfirmasi email tidak tersedia. Hubungi administrator.');
    } finally {
      button.disabled = false;
    }
  }

  // ===== BACKEND AUTH ONLY =====
  async function simulateLogin(username, password) {
    const isLocalEnvironment = ['localhost', '127.0.0.1', 'management-production-tumanggor-production.up.railway.app'].includes(window.location.hostname);

    if (isLocalEnvironment) {
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if (response.ok && result.status === 'success') return result.user;
        const error = new Error(result.message || 'Username atau password salah');
        error.warning = result.warning || '';
        error.failedAttempts = result.failedAttempts || 0;
        error.locked = result.locked === true;
        throw error;
      } catch (error) {
        if (error instanceof TypeError) {
          throw new Error('Server login lokal tidak tersedia. Jalankan START_SERVER.bat lalu coba lagi.');
        }
        throw error;
      }
    }

    const demoUsers = {
      'superadmin': { pass: 'admin123', role: 'SUPER_ADMIN', name: 'Rahmat Fauzi Tumanggor, S.Kom', divisi: 'ALL', jabatan: 'CEO MPT', phone: '081262639095', email: 'superadmin@multicorp.com' },
      'admin_it': { pass: 'it123', role: 'ADMIN_DIVISI', name: 'Admin IT Program', divisi: 'IT Program', jabatan: 'Lead IT', phone: '081200000001', email: 'admin.it@multicorp.com' },
      'admin_net': { pass: 'net123', role: 'ADMIN_DIVISI', name: 'Admin Network', divisi: 'Network', jabatan: 'Network Specialist', phone: '081200000002', email: 'admin.net@multicorp.com' },
      'admin_food': { pass: 'food123', role: 'ADMIN_DIVISI', name: 'Admin Nusantara Food', divisi: 'Nusantara Food', jabatan: 'F&B Manager', phone: '081200000003', email: 'admin.food@multicorp.com' },
      'partner_jaya': { pass: 'partner123', role: 'PARTNER', name: 'Mitra Bisnis Jaya', divisi: 'IT Program', jabatan: 'Direktur Utama', phone: '081300000001', email: 'partner@multicorp.com' },
      'cust_budi': { pass: 'budi123', role: 'CUSTOMER', name: 'Budi Santoso', divisi: 'Network', jabatan: 'Owner', phone: '081300000002', email: 'budi@gmail.com' }
    };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'LOGIN', username, password })
      });
      const result = await response.json();
      if (response.ok && result.success) {
        const user = result.user || {};
        return {
          ...user,
          name: user.nama || user.name || username,
          divisi: user.divisi || 'ALL',
          token: result.token
        };
      }
      throw new Error(result.message || 'Username atau password salah');
    } catch (error) {
      // Fallback otomatis jika offline atau dibuka via file:/// (Failed to fetch)
      const demo = demoUsers[username.toLowerCase()];
      if (demo && demo.pass === password) {
        return {
          username,
          role: demo.role,
          name: demo.name,
          divisi: demo.divisi,
          jabatan: demo.jabatan,
          email: demo.email,
          phone: demo.phone,
          token: 'demo-token-' + Date.now()
        };
      }
      if (demo && demo.pass !== password) {
        throw new Error('Password untuk akun ' + username + ' salah.');
      }
      throw new Error(error.message === 'Failed to fetch' 
        ? 'Gagal terhubung ke server cloud. Gunakan akun demo (superadmin / admin123) atau jalankan START_SERVER.bat.' 
        : (error.message || 'Login gagal.'));
    }
  }

  // ===== REAL LOGIN FUNCTION (uncomment ketika siap connect ke backend) =====

    btnLogin.disabled = true;

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'LOGIN',
          username: username,
          password: password
        })
      });

      const result = await response.json();

      if (result.status === 'success') {
        // Save user session
        sessionStorage.setItem('multicorp_session', JSON.stringify(result.user));
        showAlert('success', 'Login berhasil!');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      } else {
        showAlert('error', result.message || 'Login gagal');
      }
    } catch (error) {
      showAlert('error', 'Terjadi kesalahan: ' + error.message);
    } finally {
      btnLogin.classList.remove('loading');
      btnLogin.disabled = false;
    }
  }
  */

  // ===== PAGE LOAD =====
  document.addEventListener('DOMContentLoaded', () => {
    // Check URL params untuk pre-fill username secara aman
    const urlParams = new URLSearchParams(window.location.search);
    const autoUser = urlParams.get('user');

    if (autoUser) {
      document.getElementById('username').value = autoUser;
      document.getElementById('password').focus();
    } else {
      // Check localStorage untuk remember me
      const saved = localStorage.getItem('multicorp_last_username');
      if (saved) {
        try {
          const username = saved;
          document.getElementById('username').value = username;
          document.getElementById('rememberMe').checked = true;
          document.getElementById('password').focus();
        } catch (e) {
          // Error parsing, skip
        }
      }
    }

    // Enter key to submit
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  });

  // ===== PASSWORD VISIBILITY TOGGLE =====
  document.addEventListener('DOMContentLoaded', () => {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.createElement('button');
    toggleButton.type = 'button';
    toggleButton.className = 'btn btn-sm position-absolute top-50 end-0 translate-middle-y';
    toggleButton.style.zIndex = '10';
    toggleButton.style.border = 'none';
    toggleButton.style.background = 'transparent';
    toggleButton.style.color = 'var(--gold-primary)';
    toggleButton.innerHTML = '<i class="fas fa-eye"></i>';
    
    toggleButton.addEventListener('click', (e) => {
      e.preventDefault();
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleButton.innerHTML = isPassword 
        ? '<i class="fas fa-eye-slash"></i>' 
        : '<i class="fas fa-eye"></i>';
    });

    const passwordGroup = passwordInput.parentElement;
    passwordGroup.style.position = 'relative';
    passwordGroup.appendChild(toggleButton);
  });
</script>
</body>
</html>
